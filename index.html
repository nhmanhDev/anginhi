<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c212b" />
    <title>Ăn gì nhỉ — Chọn món hôm nay</title>
    <script>
      window.__bootCap = setTimeout(function () {
        var el = document.getElementById('boot-loader')
        if (el) el.classList.add('boot-loader-hidden')
      }, 5000)
    </script>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #1c212b;
        color: #f2f2f2;
        font-family: system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #boot-loader.boot-loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-badge {
        position: relative;
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 28px;
      }
      .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-top-color: #ff5a2a;
        animation: bootSpin 0.9s linear infinite;
      }
      .boot-dots { display: inline-flex; gap: 4px; margin-left: 4px; }
      .boot-dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #f2f2f2;
        animation: bootDot 1s infinite ease-in-out;
      }
      .boot-dots i:nth-child(2) { animation-delay: 0.15s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @keyframes bootDot {
        0%, 80%, 100% { opacity: 0.2; }
        40% { opacity: 1; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap"
    />
  </head>
  <body spellcheck="false">
    <div id="boot-loader">
      <div class="boot-badge">
        <span class="boot-ring"></span>
        <span>Ă</span>
      </div>
      <p>Đang tải dữ liệu<span class="boot-dots"><i></i><i></i><i></i></span></p>
    </div>
    <script>
      ;(function () {
        var el = document.getElementById('boot-loader')
        var hide = function () {
          if (el) el.classList.add('boot-loader-hidden')
        }
        function ready() {
          var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()
          var gate = Promise.race([
            fonts,
            new Promise(function (resolve) {
              setTimeout(resolve, 1600)
            }),
          ])
          gate.then(function () {
            clearTimeout(window.__bootCap)
            requestAnimationFrame(hide)
          })
        }
        if (document.readyState === 'complete') ready()
        else window.addEventListener('load', ready)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
