  </defs>
  <rect width="64" height="64" rx="16" fill="url(#foodGrad)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
