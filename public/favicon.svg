      <stop offset="0%" stop-color="#FF7547"/>
      <stop offset="100%" stop-color="#E84A1A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
